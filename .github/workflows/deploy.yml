# Builds the site and deploys it to Cloudflare (Workers static assets, the
# successor to Pages; see wrangler.jsonc).
#
# Runs on every push to main, every 6 hours, when the app repository publishes a
# release (repository_dispatch "kuchie-release"), and by hand. Each build reads
# the latest releases from GitHub, so the changelog, the download page and the
# AltStore source stay current without manual steps.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types: [kuchie-release]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Exposed at job level so the deploy step can be skipped until the secret exists.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (fetches releases from GitHub)
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}

      - run: npm run check:budget

      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
